[functions.ai]
# Authentication is verified inside the function with the Supabase Auth user JWT.
# Disable the legacy platform JWT gate so asymmetric/auth-key sessions are handled consistently.
verify_jwt = false

# This function serves authenticated checkout requests and signed Razorpay webhooks.
# It performs its own JWT and webhook-signature validation.
[functions.payments]
verify_jwt = false


# The worker is invoked by pg_cron/pg_net with a dedicated Vault token rather than a user JWT.
# The function validates X-ProjectX-Worker-Token against the server-only Vault secret.
[functions.projectx-worker]
verify_jwt = false
