name: Apply ProjectX UX v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-projectx-ux.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply UX patch
        run: node scripts/apply-projectx-ux.mjs
      - name: Apply canonical runtime fix
        run: node scripts/one-time-runtime-fix.mjs
      - name: Verify
        run: |
          node --check app.js
          node --check px-final.js
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js styles.css px-final.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: canonical runtime mutations and section routing'
          git push
