name: Fix broken click handlers

on:
  workflow_dispatch:
  push:
    paths:
      - 'app.js'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove stale bindEvents call
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = '    bindEvents();\n'
          if old in s:
              s = s.replace(old, '', 1)
          p.write_text(s)
          print('bindEvents call present:', old in s)
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore global click delegation'
          git push
