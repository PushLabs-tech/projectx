name: ProjectX checks

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]

# Push and pull_request events for the same branch share a group so stale CI does not
# consume runners after a newer commit supersedes it.
concurrency:
  group: projectx-checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    # Temporary, tightly scoped bootstrap: commit the resolver-generated lockfile once.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check runtime
        run: node --version && npm --version
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      # Bootstrap once on same-repository PRs; remove this step and restore read-only permissions after the file is tracked.
      - name: Bootstrap npm lockfile on PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.payload.pull_request.head.ref;
            try {
              await github.rest.repos.getContent({ owner, repo, path: 'package-lock.json', ref: branch });
              core.info('package-lock.json already exists on PR branch; no commit needed.');
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const content = fs.readFileSync('package-lock.json', 'utf8');
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: 'package-lock.json', branch,
              message: 'build: add npm lockfile for reproducible CI',
              content: Buffer.from(content, 'utf8').toString('base64')
            });
            core.info('Committed npm-generated package-lock.json to PR branch.');

      - name: Audit resolved npm dependency tree
        run: npm audit --audit-level=high

      - name: Run ProjectX checks
        run: npm test

      - name: Build production artifact
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        env:
          PROJECTX_E2E_EMAIL: ${{ secrets.PROJECTX_E2E_EMAIL }}
          PROJECTX_E2E_PASSWORD: ${{ secrets.PROJECTX_E2E_PASSWORD }}
        run: npm run e2e:ci
