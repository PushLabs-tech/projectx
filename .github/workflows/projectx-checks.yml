name: ProjectX checks

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]

# Push and pull_request events for the same branch share a group so stale CI does not
# consume runners after a newer commit supersedes it.
concurrency:
  group: projectx-checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check runtime
        run: node --version && npm --version
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund



      - name: Audit resolved npm dependency tree
        run: npm audit --audit-level=high

      - name: Run ProjectX checks
        run: npm test

      - name: Build production artifact
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        env:
          PROJECTX_E2E_EMAIL: ${{ secrets.PROJECTX_E2E_EMAIL }}
          PROJECTX_E2E_PASSWORD: ${{ secrets.PROJECTX_E2E_PASSWORD }}
        run: npm run e2e:ci
