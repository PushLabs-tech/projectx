name: Apply ProjectX forensic fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/forensic_fix.py'
      - '.github/workflows/apply-forensic-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: projectx-forensic-fix
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[forensic-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize patcher source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('scripts/forensic_fix.py')
          s = p.read_text(encoding='utf-8')
          open_marker = "CORE = r'''"
          close_marker = "\n'''\n\nwrite('projectx-core.js', CORE)"
          start = s.index(open_marker)
          close = s.index(close_marker, start)
          inner = s[start + len(open_marker):close]
          if '"""' in inner:
              raise SystemExit('CORE payload contains a triple-double quote; refusing unsafe rewrite')
          s = s[:start] + 'CORE = r"""' + inner + '"""' + s[close + len(close_marker):]
          s = s.replace("\nprint('[forensic-fix] repository patched')\n'''\n\n# Basic preflight", "\nprint('[forensic-fix] repository patched')\n\n# Basic preflight", 1)
          old = "    start = source.find(marker)\n    if start < 0:\n        fail(f'function {name} not found')"
          new = "    start = source.find(marker)\n    if start >= 6 and source[start - 6:start] == 'async ':\n        start -= 6\n    if start < 0:\n        fail(f'function {name} not found')"
          if old not in s:
              raise SystemExit('replace_function boundary pattern missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python3 -m py_compile scripts/forensic_fix.py
      - name: Apply forensic fixes
        run: python3 scripts/forensic_fix.py
      - name: Generated-source sanity
        run: |
          ! grep -R -n "async async function" -- px-final.js projectx-core.js supabase/functions/ai/index.ts
          test ! -e projectx-output.js
      - name: Diff check
        run: git diff --check
      - name: Canonical mutation probe
        run: |
          node --input-type=module - <<'NODE'
          import { createProject, applySpecChange, validateSpec } from './projectx-core.js';
          const project = createProject({
            title: 'Probe', type: 'Game',
            spec: {
              goal: 'A browser game that avoids obstacles', users: ['players'],
              requirements: ['Avoid obstacles'], deliverables: ['Playable game'], platform: 'Web',
              game: { loop: 'jump and avoid' }
            }
          });
          const before = project.specVersion;
          applySpecChange(project, { features: { add: ['Pause menu'] } });
          if (project.specVersion !== before + 1) throw new Error(`mutation did not bump version: ${project.specVersion} vs ${before + 1}`);
          if (!project.spec.features.includes('Pause menu')) throw new Error('mutation did not add feature');
          if (validateSpec({ goal: 'Build a study app for students', users: ['students'], requirements: ['cloud account sync'], constraints: ['no backend'], deliverables: ['working app'], platform: 'mobile' }, 'Mobile').valid) throw new Error('semantic contradiction was accepted');
          console.log('PASS: canonical mutation probe');
          NODE
      - name: Fix runtime regression test contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('scripts/projectx-runtime-test.mjs')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"applySpecChange\(game,\s*\{\s*features:\s*\['Pause menu'\]\s*\}\);", "applySpecChange(game, { features: { replace: ['Pause menu'] } });", s, count=1)
          s=re.sub(r"assert\.equal\(game\.specVersion, before \+ 1\);", "assert.equal(game.specVersion, before + 1);\nassert.equal(game.tests.status, 'stale');", s, count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax and regression tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[forensic-fix] canonical state, context, versioning, and artifact fixes"
          git push
