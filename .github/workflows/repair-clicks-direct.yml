name: Repair ProjectX click handlers

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair click initialization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()

          # Remove stale per-render binding calls. The app uses one global delegated handler.
          s = s.replace('    bindEvents();\n', '')
          s = s.replace('  bindEvents();\n', '')

          # Make delegated click handling resilient if a third-party/edge target is not an Element.
          old = '  document.addEventListener("click", e => {\n'
          new = '  document.addEventListener("click", e => {\n    if (!e.target || typeof e.target.closest !== "function") return;\n'
          if old in s and new not in s:
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commit repaired app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          if git diff --cached --quiet; then
            echo 'No click-handler changes were needed.'
            exit 0
          fi
          git commit -m 'fix: repair global click handling'
          git push
