name: One-shot adaptive runtime hotfix
on:
  push:
    branches: [main]
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[adaptive-hotfix]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch adaptive runtime
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('projectx-adaptive.js')
          text = p.read_text(encoding='utf-8')

          new_gemini = r'''async function gemini(contents,instruction,jsonMode=false){const k=apiKey();if(!k)throw Error('NO_KEY');let last;for(const m of MODELS){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);try{const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k},body:JSON.stringify({systemInstruction:{parts:[{text:instruction}]},contents,generationConfig:jsonMode?{temperature:.3,responseMimeType:'application/json'}:{temperature:.45}}),signal:controller.signal});if(!r.ok)throw Error('Gemini '+r.status);const d=await r.json(),t=d?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('').trim();if(t)return t}catch(e){last=e}finally{clearTimeout(timer)}}throw last||Error('AI unavailable')}'''
          text, n1 = re.subn(r"async function gemini\(contents,instruction,jsonMode=false\)\{.*?\}\nconst toJson", new_gemini + "\nconst toJson", text, count=1, flags=re.S)
          if n1 != 1:
              raise SystemExit('gemini function patch target not found')

          new_shell = r'''let root;function shell(body){clearLegacy();addCSS();if(!root){root=document.createElement('div');root.id='pxa';document.body.appendChild(root)}root.innerHTML=navHTML()+`<main class="pxa-main">${body}</main>`;root.onclick=e=>{const b=e.target.closest('#pxa [data-nav]');if(!b)return;e.preventDefault();e.stopPropagation();navigate(b.dataset.nav)};$$('#pxa [data-project]').forEach(b=>b.onclick=()=>{const p=state().projects.find(x=>x.id===b.dataset.project);if(p)project(p)})}'''
          text, n2 = re.subn(r"let root;function shell\(body\)\{.*?\}\nfunction navHTML", new_shell + "\nfunction navHTML", text, count=1, flags=re.S)
          if n2 != 1:
              raise SystemExit('shell function patch target not found')

          new_interview = r'''function interview(intent){const guess=classify(intent),qs=fallbackQs(guess),msgs=[{role:'user',text:intent}],answers=[],cur={type:guess,title:intent.split(/[\n.!?]/)[0].slice(0,80),sections:GROUPS[guess]||GROUPS.Other};shell(`<div class="pxa-top"><button data-nav="home">← Home</button></div><div class="pxa-panel" style="max-width:800px"><div class="pxa-kicker">PROJECT X · ADAPTIVE INTERVIEW</div><h1>Let’s shape it.</h1><p class="pxa-sub">One chat first. The AI decides what you are building and what workspace it needs.</p><div class="pxa-log" id="ilog"></div><form class="pxa-form" id="iform"><textarea id="iinput" placeholder="Answer in your own words..."></textarea><button type="submit" id="isend">Send</button></form><div class="pxa-sub" id="istatus" style="text-align:center">Thinking…</div></div>`);const form=$('#iform'),input=$('#iinput'),send=$('#isend');const draw=()=>{$('#ilog').innerHTML=msgs.map(m=>`<div class="pxa-msg ${m.role==='user'?'user':'ai'}">${esc(m.text)}</div>`).join('');$('#ilog').scrollTop=$('#ilog').scrollHeight;input?.focus()};const askFallback=n=>{const q=qs[Math.min(n,qs.length-1)];msgs.push({role:'assistant',text:q});$('#istatus').textContent=`Question ${Math.min(n+1,qs.length)} of ${qs.length}`;draw()};let first=true;(async()=>{try{const d=await interviewAI(msgs);Object.assign(cur,d);if(d.done)finish(cur,answers,intent);else{msgs.push({role:'assistant',text:d.question});$('#istatus').textContent='Adaptive question 1';draw()}}catch{askFallback(0)}})();form.onsubmit=async e=>{e.preventDefault();if(form.dataset.busy==='1')return;const a=input.value.trim();if(!a)return;form.dataset.busy='1';send.disabled=true;msgs.push({role:'user',text:a});answers.push(a);input.value='';$('#istatus').textContent='Thinking…';draw();try{const d=await interviewAI(msgs);Object.assign(cur,d);if(d.done){finish(cur,answers,intent);return}msgs.push({role:'assistant',text:d.question});$('#istatus').textContent=`Adaptive question ${answers.length+1}`;draw()}catch{if(answers.length<qs.length){askFallback(answers.length)}else{finish(cur,answers,intent);return}}finally{delete form.dataset.busy;send.disabled=false}};input.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();form.requestSubmit()}}}'''
          text, n3 = re.subn(r"function interview\(intent\)\{.*?\}\nfunction finish", new_interview + "\nfunction finish", text, count=1, flags=re.S)
          if n3 != 1:
              raise SystemExit('interview function patch target not found')

          p.write_text(text, encoding='utf-8')
          print('patched adaptive runtime')
      - name: Verify syntax
        run: node --check projectx-adaptive.js
      - name: Commit hotfix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hotfix-adaptive-runtime.yml
          git add projectx-adaptive.js
          git commit -m "fix: harden adaptive chat navigation and sends [adaptive-hotfix]"
          git push
